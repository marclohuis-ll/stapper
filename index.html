<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1A17">
<meta name="description" content="Stapper — wandelroutes die kinderen zelf willen lopen.">
<title>Stapper — lopen wordt zoeken</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<!-- mobile-web-app-capable is de gestandaardiseerde naam; de apple-variant staat
     erbij omdat oudere iOS-versies alleen die kennen. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stapper">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700;900&family=Figtree:wght@400;500;600&family=Fredoka:wght@500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>

  <!-- Klassieke script-tag: app.js is een module en draait daarna, dus
       window.maplibregl bestaat dan al. -->
  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
